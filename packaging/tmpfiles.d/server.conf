# Selected Debian server target; apply sysusers and verify the account first.
d /var/lib/actryn-server 0755 root root -
d /var/lib/actryn-server/broker 0700 actryn-server actryn-server -
d /run/actryn 0755 root root -
d /run/actryn/brokers 0700 actryn-server actryn-server -
d /run/actryn-server 0755 actryn-server actryn-server -
d /sys/fs/cgroup/actryn 0755 root root -
w /sys/fs/cgroup/cgroup.subtree_control - - - - +cpu +memory +pids +io
