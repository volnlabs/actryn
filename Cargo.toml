[workspace]
resolver = "2"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "=1.0.104"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.2", features = ["full"] }
libc = "=0.2.190"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
thiserror = "=2.0.21"

[profile.release]
overflow-checks = true
panic = "abort"
