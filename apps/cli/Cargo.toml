[package]
name = "actryn-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "actryn"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
actryn-server = { path = "../server" }
robot-rpc = { path = "../../crates/robot-rpc" }
authority-client = { path = "../../crates/authority-client" }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }

[dev-dependencies]
tempfile.workspace = true
rcgen = "=0.14.10"
