name: Host checks

on:
  push:
    branches: [main, feat/v0.0.1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [rust, python, kernel-host]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.5'
      - name: Install host check prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libelf-dev zlib1g-dev protobuf-compiler
          python -m pip install --require-hashes --only-binary=:all: -r ci/requirements.txt
      - name: Select repository Rust toolchain
        if: matrix.suite == 'rust'
        run: rustup show active-toolchain
      - name: Run checks
        env:
          SUITE: ${{ matrix.suite }}
        run: python ci/check.py "$SUITE" --output "artifacts/ci/$SUITE"
      - name: Retain check results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: host-${{ matrix.suite }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/${{ matrix.suite }}/
          if-no-files-found: warn
          retention-days: 30
