[build-system]
requires = ["setuptools==82.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "actryn-sdk"
version = "0.0.1"
description = "Typed stable-handle client for the Actryn software preview"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["protobuf==7.36.1"]

[tool.setuptools]
packages = ["actryn"]
